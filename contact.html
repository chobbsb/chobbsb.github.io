<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Colin Hobbs</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header class="animated">
      <a href="index.html" class="logo">Colin Hobbs</a>
      <nav class="navbar">
        <a href="index.html">About</a>
        <a href="resume.html">Resume</a>
        <a href="project.html">Project</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <section class="contact-section animated">
      <h1>Contact</h1>

      <!-- Google Map: Portland, Oregon 97266 -->
      <div class="map-container">
        <iframe
          src="https://maps.app.goo.gl/GM5DKNM3DLUQ6s9t7"
          width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <!-- Contact Form -->
      <div class="form-container">
        <h2>Get in Touch</h2>
        <form class="contact-form" action="https://formspree.io/f/mnnzwqll" method="POST">
          <div class="input-row">
            <input type="text" name="name" placeholder="Full name" required>
            <input type="email" name="email" placeholder="Email address" required>
          </div>
          <input type="text" name="subject" placeholder="Subject" required>
          <textarea rows="6" name="message" placeholder="Your Message" required></textarea>
          <!-- honeypot to reduce spam-->
          <input type="text" name="_gotcha" style="display:none">
          <input type="hidden" name="subject" value="New message from GitHub portolio contact form">
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </section>
  </div>
</body>

</html>
